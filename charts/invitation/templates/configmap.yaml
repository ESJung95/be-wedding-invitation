{{/*
비밀이 아닌 접속 정보만. 이 ConfigMap 의 키 이름이 곧 환경변수 이름이고,
application.yml 의 ${DB_HOST} 등이 그대로 이것을 읽는다.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "invitation.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "invitation.labels" . | nindent 4 }}
data:
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USERNAME: {{ .Values.database.username | quote }}
