spring:
  application:
    name: invitation

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      platform: postgresql

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: wedding-invitation

jwt:
  admin:
    secret: ${JWT_ADMIN_SECRET}
    access-token-expiration: 3600000       # 1시간 (ms)
    refresh-token-expiration: 1209600000   # 14일 (ms)

server:
  port: 8080